# À chaque push sur main : on publie la page sur GitHub Pages.
# Seuls les fichiers du site sont publiés (liste blanche ci-dessous) : pas README.md.
# Un nouveau fichier du site (image, page) doit être ajouté à la liste.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    name: Publication sur GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url || steps.deploiement-2.outputs.page_url || steps.deploiement-3.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer le site (liste blanche des fichiers publiés)
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp index.html logo.svg apple-touch-icon.png "$RUNNER_TEMP/site/"
          ls -l "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      # deploy-pages ne trouve parfois pas l'archive qui vient d'être envoyée (« No artifacts named
      # "github-pages" were found ») : on retente la publication après 20 s, puis après 60 s.
      - name: Publier sur GitHub Pages
        id: deploiement
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Patienter avant un deuxième essai
        if: steps.deploiement.outcome == 'failure'
        run: sleep 20
      - name: Publier sur GitHub Pages (2e essai)
        id: deploiement-2
        if: steps.deploiement.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Patienter avant un troisième essai
        if: steps.deploiement-2.outcome == 'failure'
        run: sleep 60
      - name: Publier sur GitHub Pages (3e essai)
        id: deploiement-3
        if: steps.deploiement-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
